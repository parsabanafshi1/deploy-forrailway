<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <!-- Redirect سریع -->
    <meta http-equiv="refresh" content="0; url=https://github.com/aghabanafshi6122/myprojectt">

    <!-- برای سئو: اعلام آدرس اصلی به موتورهای جستجو -->
    <link rel="canonical" href="https://github.com/aghabanafshi6122/myprojectt">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1a1025 0%, #2d1b4e 50%, #1a1025 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 400px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(168, 85, 247, 0.2);
        }
        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 25px;
            border: 4px solid rgba(168, 85, 247, 0.2);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 1.4rem; margin-bottom: 10px; color: #e9d5ff; }
        p { color: #a1a1aa; font-size: 0.9rem; margin-bottom: 20px; }
        a {
            display: inline-block;
            color: #c084fc;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            border: 1px solid #a855f7;
            border-radius: 10px;
            transition: all 0.3s;
        }
        a:hover { background: #a855f7; color: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h1>Redirecting...</h1>
        <p>در حال انتقال به GitHub...</p>
        <a href="https://github.com/aghabanafshi6122/myprojectt">کلیک کنید اگر منتقل نشدید</a>
    </div>

    <script>
        // ریدایرکت فوری با JS (سریع‌تر از meta refresh)
        window.location.replace("https://github.com/aghabanafshi6122/myprojectt");
    </script>
</body>
</html>
